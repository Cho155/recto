# Recto · Alacritty ({{ theme_name }})
# Generated by tools/recto-theme. Edit templates/alacritty/recto.toml instead.
# Use it from alacritty.toml. Open windows pick up a theme switch the next
# time Alacritty reloads its config.
#   [general]
#   import = ["{{ paths.data }}/current/alacritty/recto.toml"]

[window]
opacity = {{ t.terminal_alpha }}
padding = { x = {{ shape.terminal_pad }}, y = {{ shape.terminal_pad }} }

[font]
size = {{ font.pt.terminal }}
normal = { family = "{{ font.mono }}" }

[colors.primary]
background = "{{ t.base }}"
foreground = "{{ t.text }}"

[colors.cursor]
text = "{{ t.cursor_text }}"
cursor = "{{ t.cursor }}"

[colors.selection]
text = "CellForeground"
background = "{{ t.selection }}"

[colors.normal]
black   = "{{ t.ansi.black }}"
red     = "{{ t.ansi.red }}"
green   = "{{ t.ansi.green }}"
yellow  = "{{ t.ansi.yellow }}"
blue    = "{{ t.ansi.blue }}"
magenta = "{{ t.ansi.magenta }}"
cyan    = "{{ t.ansi.cyan }}"
white   = "{{ t.ansi.white }}"

[colors.bright]
black   = "{{ t.ansi.bright_black }}"
red     = "{{ t.ansi.bright_red }}"
green   = "{{ t.ansi.bright_green }}"
yellow  = "{{ t.ansi.bright_yellow }}"
blue    = "{{ t.ansi.bright_blue }}"
magenta = "{{ t.ansi.bright_magenta }}"
cyan    = "{{ t.ansi.bright_cyan }}"
white   = "{{ t.ansi.bright_white }}"
