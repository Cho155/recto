# Recto · fcitx5 classic UI (both themes)
# Generated by tools/recto-theme. Edit templates/fcitx5/classicui.conf instead.
# Paper by day and Ink at night: fcitx5 follows the system's light or dark
# setting, which recto-theme switches with the rest of the desktop.
Theme=recto-paper
DarkTheme=recto-ink
UseDarkTheme=True
UseAccentColor=False
# Candidates in the book face; Chinese falls back to Noto Serif CJK (fontconfig, D99).
Font="{{ font.serif }} {{ font.pt.input_method }}"
MenuFont="{{ font.serif }} {{ font.pt.ui }}"
TrayFont="{{ font.sans }} {{ font.pt.ui }}"
Vertical Candidate List=False
WheelForPaging=True
PreferTextIcon=True
EnableFractionalScale=True
