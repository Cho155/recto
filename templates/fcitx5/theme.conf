# Recto · fcitx5 candidate window ({{ theme_name }})
# Generated by tools/recto-theme. Edit templates/fcitx5/ instead.
# A slip of paper under the text: the page colour, a hairline edge, candidates
# in the serif, the current one on the clay tint of selected text.

[Metadata]
Name=Recto {{ theme_name | title }}
Version=1
Author=Recto
Description=Recto's {{ theme_name | title }} theme
ScaleWithDPI=True

[InputPanel]
NormalColor={{ t.text }}
HighlightCandidateColor={{ t.text }}
HighlightColor={{ t.text }}
HighlightBackgroundColor={{ t.selection }}
PageButtonAlignment=Last Candidate
EnableBlur=False
FullWidthHighlight=False

[InputPanel/TextMargin]
Left=7
Right=7
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=5
Right=5
Top=5
Bottom=5

[InputPanel/Background]
Image=panel.svg

[InputPanel/Background/Margin]
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/Highlight]
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=4
Right=4
Top=4
Bottom=4

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu/Background]
Image=panel.svg

[Menu/Background/Margin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/ContentMargin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Highlight]
Image=highlight.svg

[Menu/Highlight/Margin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/Separator]
