# Recto · fuzzel ({{ theme_name }})
# Generated by tools/recto-theme. Edit templates/fuzzel/fuzzel.ini instead.
# Text first: no icons, one quiet placeholder, matches in clay.

[main]
font={{ font.serif }}:size={{ font.pt.launcher }}
prompt=""
placeholder=Search apps
icons-enabled=no
terminal=footclient
anchor=top
y-margin=160
width=44
lines=8
horizontal-pad=20
vertical-pad=14
inner-pad=8
layer=overlay

[colors]
background={{ t.base | bare_alpha(1) }}
text={{ t.text | bare_alpha(1) }}
message={{ t.muted | bare_alpha(1) }}
prompt={{ t.muted | bare_alpha(1) }}
placeholder={{ t.muted | bare_alpha(1) }}
input={{ t.text | bare_alpha(1) }}
match={{ t.accent_text | bare_alpha(1) }}
selection={{ t.raised | bare_alpha(1) }}
selection-text={{ t.text | bare_alpha(1) }}
selection-match={{ t.accent_text | bare_alpha(1) }}
counter={{ t.muted | bare_alpha(1) }}
border={{ t.line | bare_alpha(1) }}

[border]
width={{ shape.hairline }}
radius={{ shape.radius_panel }}
