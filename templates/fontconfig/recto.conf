<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Recto · fontconfig
  Generated by tools/recto-theme. Edit templates/fontconfig/recto.conf instead.

  Chinese, Japanese and Korean text. Recto's faces have no CJK glyphs, so each
  one is followed by a CJK face of the same kind: serif by serif, mono by mono.
  Without this, fontconfig takes the first CJK font it finds, which may draw
  Chinese with Korean or Japanese glyph shapes, or set serif text in a sans.
  The generic families point at Recto's faces, so apps that ask for "serif",
  "sans-serif" or "monospace" (a browser's defaults) match the desktop.
-->
<fontconfig>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>{{ font.serif }}</family><family>{{ font.cjk.serif }}</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>{{ font.sans }}</family><family>{{ font.cjk.sans }}</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>{{ font.mono }}</family><family>{{ font.cjk.mono }}</family></prefer>
  </alias>

  <!-- Asked for by name: the CJK face comes right after. -->
  <match target="pattern">
    <test name="family"><string>{{ font.serif }}</string></test>
    <edit name="family" mode="append" binding="strong"><string>{{ font.cjk.serif }}</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>{{ font.serif_small }}</string></test>
    <edit name="family" mode="append" binding="strong"><string>{{ font.cjk.serif }}</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>{{ font.serif_display }}</string></test>
    <edit name="family" mode="append" binding="strong"><string>{{ font.cjk.serif }}</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>{{ font.sans }}</string></test>
    <edit name="family" mode="append" binding="strong"><string>{{ font.cjk.sans }}</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>{{ font.mono }}</string></test>
    <edit name="family" mode="append" binding="strong"><string>{{ font.cjk.mono }}</string></edit>
  </match>
</fontconfig>
