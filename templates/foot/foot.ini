# Liubai · foot (Paper and Ink in one file)
# Generated by tools/liubai-theme. Edit templates/foot/foot.ini instead.
# Paper is foot's light theme and Ink its dark theme. `liubai-theme switch`
# sends SIGUSR2 (light) or SIGUSR1 (dark), so open terminals change in place.

[main]
font={{ font.mono }}:size={{ font.pt.terminal }}
pad={{ shape.terminal_pad }}x{{ shape.terminal_pad }}
initial-color-theme={{ default.scheme }}

[cursor]
style=block
blink=no

[colors-light]
alpha={{ paper.terminal_alpha }}
blur={{ terminal.blur | yesno }}
background={{ paper.base | bare }}
foreground={{ paper.text | bare }}
cursor={{ paper.cursor_text | bare }} {{ paper.cursor | bare }}
selection-foreground={{ paper.text | bare }}
selection-background={{ paper.selection | bare }}
urls={{ paper.info | bare }}
jump-labels={{ paper.base | bare }} {{ paper.accent_text | bare }}
search-box-match={{ paper.text | bare }} {{ paper.selection | bare }}
search-box-no-match={{ paper.danger_fg | bare }} {{ paper.danger | bare }}
regular0={{ paper.ansi.black | bare }}
regular1={{ paper.ansi.red | bare }}
regular2={{ paper.ansi.green | bare }}
regular3={{ paper.ansi.yellow | bare }}
regular4={{ paper.ansi.blue | bare }}
regular5={{ paper.ansi.magenta | bare }}
regular6={{ paper.ansi.cyan | bare }}
regular7={{ paper.ansi.white | bare }}
bright0={{ paper.ansi.bright_black | bare }}
bright1={{ paper.ansi.bright_red | bare }}
bright2={{ paper.ansi.bright_green | bare }}
bright3={{ paper.ansi.bright_yellow | bare }}
bright4={{ paper.ansi.bright_blue | bare }}
bright5={{ paper.ansi.bright_magenta | bare }}
bright6={{ paper.ansi.bright_cyan | bare }}
bright7={{ paper.ansi.bright_white | bare }}

[colors-dark]
alpha={{ ink.terminal_alpha }}
blur={{ terminal.blur | yesno }}
background={{ ink.base | bare }}
foreground={{ ink.text | bare }}
cursor={{ ink.cursor_text | bare }} {{ ink.cursor | bare }}
selection-foreground={{ ink.text | bare }}
selection-background={{ ink.selection | bare }}
urls={{ ink.info | bare }}
jump-labels={{ ink.base | bare }} {{ ink.accent | bare }}
search-box-match={{ ink.text | bare }} {{ ink.selection | bare }}
search-box-no-match={{ ink.danger_fg | bare }} {{ ink.danger | bare }}
regular0={{ ink.ansi.black | bare }}
regular1={{ ink.ansi.red | bare }}
regular2={{ ink.ansi.green | bare }}
regular3={{ ink.ansi.yellow | bare }}
regular4={{ ink.ansi.blue | bare }}
regular5={{ ink.ansi.magenta | bare }}
regular6={{ ink.ansi.cyan | bare }}
regular7={{ ink.ansi.white | bare }}
bright0={{ ink.ansi.bright_black | bare }}
bright1={{ ink.ansi.bright_red | bare }}
bright2={{ ink.ansi.bright_green | bare }}
bright3={{ ink.ansi.bright_yellow | bare }}
bright4={{ ink.ansi.bright_blue | bare }}
bright5={{ ink.ansi.bright_magenta | bare }}
bright6={{ ink.ansi.bright_cyan | bare }}
bright7={{ ink.ansi.bright_white | bare }}
